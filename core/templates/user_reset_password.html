{% extends 'base.html' %}

{% block title %}Reset Password - AB Traders CMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-white py-3 border-0">
                <h5 class="fw-bold mb-0 text-dark"><i class="bi bi-key-fill text-warning me-2"></i>Reset Password for: {{ target_user.username }}</h5>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">New Password</label>
                        {{ form.new_password }}
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-secondary small fw-semibold">Confirm New Password</label>
                        {{ form.confirm_password }}
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'user_list' %}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-warning text-dark fw-bold px-4">Update Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
